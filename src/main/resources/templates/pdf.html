<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PDF 预览</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }
        #viewer {
            width: 100vw;
            height: 100vh;
            border: none;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="viewer">
        <!-- 移除工具栏并尝试透明背景 -->
        <iframe th:src="${fileAttribute.convertedFilePath + '#toolbar=0&navpanes=0&view=FitH'}" 
                allowtransparency="true" frameborder="0"></iframe>
    </div>
</body>
</html>
