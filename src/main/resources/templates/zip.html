<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>压缩包预览 - [[${fileAttribute.fileName}]]</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/home.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        :root {
            --sidebar-width: 260px;
            --row-height: 32px;
            --indent-size: 20px;
            --primary-blue: #0A84FF;
            --bg-dark: rgba(28, 28, 30, 0.85);
            --text-muted: #AEAEB2;
            --text-active: #FFFFFF;
        }

        body, html { height: 100vh; margin: 0; padding: 0; overflow: hidden; background: transparent; }
        .full-explorer { display: flex; height: 100vh; width: 100vw; background: transparent; }

        /* --- 侧边栏整体风格 --- */
        .sidebar-panel {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-dark);
            backdrop-filter: blur(40px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .sidebar-header h2 {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* --- 预览区 --- */
        .viewer-panel { flex: 1; position: relative; background: transparent; }
        #preview-iframe { width: 100%; height: 100%; border: none; background: transparent; }

        /* --- jstree 样式深度重刻 (参照 Wechat/Finder) --- */
        .jstree-default .jstree-container-ul { padding: 8px 0 !important; }
        .jstree-default .jstree-node { 
            margin-left: var(--indent-size) !important; 
            min-height: var(--row-height) !important; 
            line-height: var(--row-height) !important; 
        }
        /* 根节点不需要左边距 */
        .jstree-container-ul > .jstree-node { margin-left: 0 !important; }

        .jstree-default .jstree-anchor { 
            color: var(--text-muted) !important; 
            font-size: 13px !important;
            height: var(--row-height) !important;
            line-height: var(--row-height) !important;
            padding: 0 10px 0 4px !important;
            border-radius: 4px;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            width: calc(100% - 30px);
        }
        
        /* 悬停状态 */
        .jstree-default .jstree-hovered {
            background: rgba(255, 255, 255, 0.08) !important;
            color: var(--text-active) !important;
            box-shadow: none !important;
        }
        
        /* 选中状态：典型的现代蓝色长条 */
        .jstree-default .jstree-clicked {
            background: var(--primary-blue) !important;
            color: var(--text-active) !important;
            font-weight: 500 !important;
            box-shadow: 0 2px 10px rgba(10, 132, 255, 0.3) !important;
        }

        /* 图标与展开按钮间距 */
        .jstree-default .jstree-icon:empty { width: 20px; }
        .fa-folder { color: #FFD60A !important; margin-right: 8px; font-size: 15px; } /* 文件夹黄 */
        .fa-file-text-o { color: #64D2FF !important; margin-right: 8px; font-size: 14px; } /* 文件蓝 */

        /* 展开箭头：极简 Caret */
        .jstree-default .jstree-ocl { 
            filter: invert(1); opacity: 0.5; background-image: none !important; 
            font-family: FontAwesome; text-align: center; font-size: 10px;
            width: 18px;
        }
        .jstree-default .jstree-closed > .jstree-ocl::before { content: "\f0da"; }
        .jstree-default .jstree-open > .jstree-ocl::before { content: "\f0d7"; }

        /* --- 加载与空态 --- */
        .loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; justify-content: center; align-items: center;
            background: transparent; backdrop-filter: blur(20px); z-index: 5;
        }
        .spinner {
            width: 24px; height: 24px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #zip-tree::-webkit-scrollbar { width: 3px; }
        #zip-tree::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="full-explorer">
        <div class="sidebar-panel">
            <div class="sidebar-header">
                <h2 th:title="${fileAttribute.fileName}"><i class="fa fa-terminal"></i> BROWSER</h2>
            </div>
            <div id="zip-tree" style="flex: 1; overflow-y: auto; padding: 10px 0;"></div>
        </div>
        <div class="viewer-panel">
            <div class="loading-overlay" id="empty-hint">
                <i class="fa fa-compass" style="opacity: 0.1; font-size: 40px; color: white;"></i>
            </div>
            <div class="loading-overlay" id="loader" style="display: none;"><div class="spinner"></div></div>
            <iframe id="preview-iframe" style="display: none;"></iframe>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
    <script th:inline="javascript">
        $(function() {
            var fileList = /*[[${fileAttribute.resultData}]]*/ [];
            var treeData = [];
            fileList.forEach(function(path) {
                var parts = path.split('/');
                var currentLevel = treeData;
                parts.forEach(function(part, index) {
                    if (!part) return;
                    var existingPath = currentLevel.find(item => item.text === part);
                    if (existingPath) {
                        currentLevel = existingPath.children;
                    } else {
                        var isFile = (index === parts.length - 1 && !path.endsWith('/'));
                        var newNode = {
                            text: part, children: [],
                            icon: isFile ? 'fa fa-file-text-o' : 'fa fa-folder'
                        };
                        currentLevel.push(newNode);
                        currentLevel = newNode.children;
                    }
                });
            });

            $('#zip-tree').jstree({
                'core': { 'data': treeData, 'themes': { 'dots': false, 'icons': true } }
            }).on('select_node.jstree', function (e, data) {
                var node = data.node;
                if (node.icon.indexOf('file') > -1) {
                    var fullPath = data.instance.get_path(node, '/');
                    var originalUrl = [[${fileAttribute.fileUrl}]];
                    var baseUrl = window.location.origin + window.location.pathname;
                    var encodedOriginalUrl = btoa(unescape(encodeURIComponent(originalUrl)));
                    var previewUrl = baseUrl + '?filePath=' + encodedOriginalUrl + '&zipEntry=' + encodeURIComponent(fullPath);
                    $('#empty-hint').hide(); $('#preview-iframe').hide(); $('#loader').show();
                    $('#preview-iframe').attr('src', previewUrl);
                } else {
                    data.instance.toggle_node(node);
                }
            });
            $('#preview-iframe').on('load', function() { if($(this).attr('src') && $(this).attr('src') !== 'about:blank') { $('#loader').hide(); $(this).show(); } });
        });
    </script>
</body>
</html>
